name: enterprise_operations
title: "Enterprise Systems Operations & Incident Response"
description: "Production telemetry, service configuration drift audit, incident root-cause diagnosis, and deterministic blast-radius remediation governance."

active_tools:
  - ops.get_incident_telemetry
  - ops.inspect_service_config
  - ops.simulate_remediation_action
  - local.calculator

policy_rules:
  - name: production_blast_radius_cap
    condition: "blast_radius_pct > 25.0"
    action: REQUIRES_APPROVAL
    description: "Automated remediation affecting greater than 25% of service capacity requires human operator approval."

  - name: active_p0_incident_freeze
    condition: "severity == 'P0' and override_authorized != true"
    action: BLOCKED
    description: "Routine configuration mutations are frozen during active P0 production incidents."

  - name: security_baseline_compliance
    condition: "tls_version < 1.3 or debug_port_open == true"
    action: BLOCKED
    description: "Service deployments violating enterprise security baseline (TLS < 1.3 or exposed debug ports) are strictly blocked."

  - name: safe_automated_restart
    condition: "blast_radius_pct <= 10.0 and severity in ['P2', 'P3']"
    action: ALLOWED
    description: "Low-impact rolling restarts within 10% capacity for non-critical services can execute autonomously."
