# Domain manifest, read by agent_runtime/domains.py.
#
# `thresholds` are the numbers policies.py enforces; the loader rejects a
# manifest with a missing or unknown threshold. `policy_rules` documents each
# rule, and the loader checks these names against the rules the code registers,
# so this file cannot silently drift from what actually runs.
name: multimodal_investigation
title: "Multimodal Business Operations & Document Audit"
description: "Invoice document extraction, telemetry chart analysis, and payment / SLA penalty governance. Extraction is simulated over pre-extracted JSON fixtures."

# Shown to the model with the decision rules: the action and parameter names
# the rules understand, and the evidence they read. It never changes a verdict.
decision_guide: |
  Payments: use recommended_action "approve_payment" with parameter document_id (for example
  "INV-2026-001"). The rules read the invoice's subtotal, tax_amount, total_amount, line_items,
  is_duplicate and settlement_status from extract_document_metrics.
  SLA penalties: use recommended_action "apply_penalty_credit" with parameter artifact_id (the chart
  id or name, for example "latency_sla_september"). The rules read the chart's monthly average
  uptime and contractual SLA threshold from analyze_chart_data.

thresholds:
  max_autonomous_expense: 1000  # dollars

entity_binding:
  target_param: document_id
  patterns:
    - '(?i)\b(?:(?:invoice|inv)[_\s-]*(?:number|num|no)?[_\s#-]*(?:inv[_\s-]*)?([a-z0-9]+(?:[-_][a-z0-9]+)+|\d+)|inv[_\s-]([a-z0-9_-]+))\b'
    - '(?i)\b(latency_sla_[a-z0-9_]+)\b'
  prefix: "inv-"

permit_tools:
  - extract_document_metrics
  - analyze_chart_data
  - list_visual_artifacts

policy_rules:
  - name: invoice_math_reconciliation
    on_violation: BLOCKED
    description: "For payments, line items must sum to the subtotal and subtotal plus tax must equal the billed total (to the cent)."
  - name: duplicate_invoice_prevention
    on_violation: BLOCKED
    description: "Invoices flagged as duplicates or already settled cannot be paid."
  - name: executive_expense_approval
    on_violation: REQUIRES_APPROVAL
    description: "Payments above max_autonomous_expense dollars require executive authorization."
  - name: sla_breach_detection
    on_violation: REQUIRES_APPROVAL
    description: "For SLA penalty actions, a monthly average uptime below the chart's contractual threshold requires commercial review; no breach blocks the penalty."
