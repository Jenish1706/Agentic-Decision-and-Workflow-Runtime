# Domain manifest, read by agent_runtime/domains.py.
#
# `thresholds` are the numbers policies.py enforces; the loader rejects a
# manifest with a missing or unknown threshold. `policy_rules` documents each
# rule, and the loader checks these names against the rules the code registers,
# so this file cannot silently drift from what actually runs.
name: product_analytics
title: "E-Commerce Checkout & Growth Analytics"
description: "Product telemetry, checkout conversion funnels, segment analysis, and A/B experiment rollout governance."

# Shown to the model with the decision rules: the action and parameter names
# the rules understand, and the evidence they read. It never changes a verdict.
decision_guide: |
  Decisions here are experiment rollouts. Use recommended_action "rollout_variant_b" with parameters
  experiment_id (for example "EXP-204") and traffic_percentage (the 0-100 share of traffic to roll
  out to). The rules read that experiment's p_value and difference_pp from test_significance.

thresholds:
  significance_alpha: 0.05
  max_autonomous_traffic_pct: 50

entity_binding:
  target_params:
    - experiment_id
    - experiment
  patterns:
    - '(?i)\b(?:(?:experiment|exp)[_\s-]*(?:number|num|no)?[_\s#-]*(\d+)|exp[_\s-]?(\d+))\b'
  prefix: "exp-"
  synonyms:
    phone: mobile
    phones: mobile
    smartphone: mobile
    smartphones: mobile
    cellphone: mobile
    cellular: mobile
    ios: mobile
    android: mobile
    workstation: desktop
    workstations: desktop
    pc: desktop
    pcs: desktop
    laptop: desktop
    laptops: desktop
    computer: desktop
    computers: desktop
    mac: desktop
    windows: desktop
    baseline_week: baseline_week
    baseline: baseline_week
    last_week: last_week
    last: last_week
    recent: last_week

permit_tools:
  - test_significance

policy_rules:
  - name: statistical_significance_gate
    on_violation: BLOCKED
    description: "A rollout needs the named experiment's p-value below significance_alpha AND the treatment ahead of control. Without a significance test in evidence the rollout requires approval."
  - name: high_impact_rollout_approval
    on_violation: REQUIRES_APPROVAL
    description: "Rollouts to more than max_autonomous_traffic_pct percent of traffic, or with no stated traffic percentage, require product lead approval."
