# Domain manifest, read by agent_runtime/domains.py.
#
# `thresholds` are the numbers policies.py enforces; the loader rejects a
# manifest with a missing or unknown threshold. `policy_rules` documents each
# rule, and the loader checks these names against the rules the code registers,
# so this file cannot silently drift from what actually runs.
name: credit_risk
title: "Consumer & Small Business Credit Underwriting"
description: "Account profiles, credit bureau history, debt-to-income analysis, and credit limit increase governance."

# Shown to the model with the decision rules: the action and parameter names
# the rules understand, and the evidence they read. It never changes a verdict.
decision_guide: |
  Decisions here are credit limit increases. Use recommended_action "approve_increase" with
  parameters account_id (for example "ACCT-101") and increase_amount (the dollar increase requested).
  The rules read that account's credit_score, delinquencies_90d and dti_ratio, and its requested
  increase_amount, from your evidence: get_account_profile returns all of them in one call.

thresholds:
  min_credit_score: 650
  max_dti_ratio: 0.43            # a fraction: 0.43 = 43%
  max_autonomous_increase: 5000  # dollars

entity_binding:
  target_params:
    - account_id
    - account
    - customer_id
    - customer
    - applicant_id
  patterns:
    - '(?i)\b(?:(?:acct|account|customer|applicant)(?:[_\s]+(?:on|for)[_\s]+(?:the[_\s]+)?account)?[_\s-]*(?:number|num|no)?[_\s#-]*(\d+)|acct[_\s-]?(\d+))\b'
  prefix: "acct-"
  synonyms:
    borrower: account
    applicant: account
    customer: account
    client: account

permit_tools:
  - get_account_profile

policy_rules:
  - name: minimum_credit_score
    on_violation: BLOCKED
    description: "A credit score below min_credit_score blocks any credit limit increase."
  - name: hard_delinquency_cutoff
    on_violation: BLOCKED
    description: "Any 90-day or greater delinquency in credit history blocks credit increases."
  - name: dti_ceiling
    on_violation: BLOCKED
    description: "A debt-to-income ratio above max_dti_ratio blocks limit expansion."
  - name: high_limit_increase_approval
    on_violation: REQUIRES_APPROVAL
    description: "Increases above max_autonomous_increase dollars require senior underwriter authorization."
